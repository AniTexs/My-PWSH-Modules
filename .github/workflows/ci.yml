name: CI - Build and Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "modules/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "modules/**"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Modules
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Write-Host "OS: $($PSVersionTable.OS)"

      - name: Install dependencies
        shell: pwsh
        run: |
          Write-Host "Installing required modules..."
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          }
          if (-not (Get-Module -ListAvailable -Name PlatyPS)) {
            Install-Module -Name PlatyPS -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Write-Host "✓ Dependencies installed"

      - name: Add repo modules to PSModulePath
        shell: pwsh
        run: |
          $modulePath = (Resolve-Path "./modules").Path
          Write-Host "Adding module path: $modulePath"

          $sep = [IO.Path]::PathSeparator   # ';' on Windows, ':' on Linux/macOS
          $new = "${modulePath}${sep}${env:PSModulePath}"

          "PSModulePath=$new" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      
      - name: Verify PSModulePath
        shell: pwsh
        run: |
          $env:PSModulePath -split [IO.Path]::PathSeparator | Select-Object -First 10 | ForEach-Object { " - $_" }

      - name: Discover changed modules
        id: discover
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Determine diff base/head depending on event type
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
            $head = "${{ github.event.pull_request.head.sha }}"
          } else {
            # push event
            $base = "${{ github.event.before }}"
            $head = "${{ github.sha }}"
          }

          if (-not $base -or $base -eq "0000000000000000000000000000000000000000") {
            # Edge case: first push on a new branch or history rewrite
            $base = "HEAD~1"
          }

          Write-Host "Diff base: $base"
          Write-Host "Diff head: $head"

          $changedFiles = git diff --name-only $base $head -- "modules/"
          if (-not $changedFiles) {
            Write-Host "No changes under modules/"
            "has_modules=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          # Extract module folder names: modules/<ModuleName>/...
          $modules = $changedFiles |
            ForEach-Object {
              if ($_ -match '^modules/([^/]+)/') { $Matches[1] }
            } |
            Where-Object { $_ } |
            Sort-Object -Unique

          if (-not $modules) {
            Write-Host "Changes detected under modules/ but no module folder could be parsed."
            "has_modules=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          Write-Host "Changed modules: $($modules -join ', ')"
          "has_modules=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "modules=$($modules -join ',')" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Run PSScriptAnalyzer
        if: steps.discover.outputs.has_modules == 'true'
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer..."
          ./build/Invoke-Analyzer.ps1

      - name: Build modules
        if: steps.discover.outputs.has_modules == 'true'
        shell: pwsh
        run: |
          $modules = "${{ steps.discover.outputs.modules }}" -split ','
          foreach ($module in $modules) {
            Write-Host "Building module: $module"
            ./build/Build-Module.ps1 -ModuleName $module
          }

      - name: Run tests
        if: steps.discover.outputs.has_modules == 'true'
        shell: pwsh
        run: |
          Write-Host "Running all tests..."
          ./build/Test-All.ps1 -OutputDirectory ./TestResults

      - name: Upload test results
        if: always() && steps.discover.outputs.has_modules == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          retention-days: 30

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && steps.discover.outputs.has_modules == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: built-modules
          path: output/
          retention-days: 7

      - name: Commit generated module docs
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && steps.discover.outputs.has_modules == 'true'
        shell: pwsh
        run: |
          $docsPath = "docs/Module Documentation"

          if (-not (Test-Path $docsPath)) {
            Write-Host "Docs path not found: $docsPath"
            exit 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only docs changes
          git add "$docsPath"

          # If nothing changed, do nothing
          $status = git status --porcelain
          if (-not $status) {
            Write-Host "No doc changes to commit."
            exit 0
          }

          git commit -m "docs: update module documentation [skip ci]"
          git push
